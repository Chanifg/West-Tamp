services:
  mysql:
    image: mysql:8.0
    container_name: westtamp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: westtamp
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: password
    # Removed host port mapping (3306:3306) to prevent external connections
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: westtamp_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: >
      bash -c "
        composer install &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan storage:link &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20
    container_name: westtamp_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      bash -c "npm install && npm run dev -- --host"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  dbdata:

